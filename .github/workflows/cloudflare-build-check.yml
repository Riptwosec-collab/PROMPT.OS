name: Cloudflare Build Check

on:
  pull_request:
  push:
    branches: [main, feat/prompt-os-single-release]
  workflow_dispatch:

concurrency:
  group: prompt-os-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore

      - name: Build OpenNext Worker
        run: npm run build

      - name: Verify OpenNext artifacts
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
          test -f .open-next/.build/open-next.config.edge.mjs

      - name: Verify Wrangler can bundle generated Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
