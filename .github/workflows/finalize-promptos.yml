name: Finalize PromptOS source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-promptos.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble PromptOS.jsx
        shell: bash
        run: |
          set -euo pipefail
          cat .promptos-upload/promptos.gz.b64.* > /tmp/promptos.gz.b64
          base64 -d /tmp/promptos.gz.b64 > /tmp/promptos.jsx.gz
          gzip -dc /tmp/promptos.jsx.gz > components/PromptOS.jsx
          actual="$(git hash-object components/PromptOS.jsx)"
          expected="4b5dbc9774acb4b44115622715374848084a7add"
          echo "PromptOS.jsx blob SHA: $actual"
          test "$actual" = "$expected"

      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .promptos-upload
          rm -f .github/workflows/finalize-promptos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Prompt.OS main workspace"
          git push origin main
