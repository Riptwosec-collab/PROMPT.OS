name: Apply Prompt Library Upgrade

on:
  push:
    branches:
      - feat/prompt-library-v1
    paths:
      - '.github/workflows/apply-prompt-library-upgrade.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/prompt-library-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Prompt.OS integration patch
        run: node scripts/apply-prompt-library-upgrade.mjs

      - name: Run tests
        run: npm test

      - name: Build OpenNext Worker
        run: npm run build

      - name: Verify generated Worker
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
          test -f .open-next/.build/open-next.config.edge.mjs

      - name: Verify Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PromptOS.jsx lib/i18n/runtime.mjs
          git rm scripts/apply-prompt-library-upgrade.mjs .github/workflows/apply-prompt-library-upgrade.yml
          git commit -m "feat: integrate prompt catalog and delete confirmations"
          git push origin HEAD:feat/prompt-library-v1
